<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${animale.nome} + ' - Dettagli'">Dettagli Animale</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-animale"> <nav class="navbar-top">
            <button type="button" onclick="window.location.href='/'" class="btn-home-nav">
                🏡 Home
            </button>
			<div class="navbar-right">
			        
			        <div class="profile-avatar-wrapper">
			            <img th:src="@{https://static8.depositphotos.com/1009634/988/v/950/depositphotos_9883921-stock-illustration-no-user-profile-picture.jpg}" alt="Profilo">
			        </div>
			        
			        <form th:if="${userDetails != null}" th:action="@{/logout}" method="POST">
			            <button type="submit" class="btn-action-nav btn-logout">Disconnetti</button>
			        </form>
			        
			        <form th:if="${userDetails == null}" th:action="@{/login}">
			            <button type="submit" class="btn-action-nav">🔑 Log in</button>
			        </form>
			        
			    </div>
    </nav>

    <main class="profile-dashboard" style="max-width: 850px;">
        
        <div class="animal-show-container">
            <div class="animal-large-pic">
                <img src="../immagini/default-animal.jpg" th:src="@{'/immagini/animale_' + ${animale.id} + '.jpg'}" alt="Foto Animale">
            </div>
            
            <div class="animal-details-box">
                <h1 class="animal-name-title" th:text="${animale.nome}">Nome Animale</h1>
                
                <div class="profile-info-grid" style="grid-template-columns: 1fr 1fr;">
                    <div class="info-item">
                        <label>Specie / Razza</label>
                        <span th:text="${animale.specie} + ' / ' + ${animale.razza}">Cane / Labradoodle</span>
                    </div>
                    
                    <div class="info-item">
                        <label>Età Calcolata</label>
                        <span th:with="oggi=${T(java.time.LocalDate).now()}" 
                              th:text="${animale.dataNascita != null ? (T(java.time.Period).between(animale.dataNascita, oggi).getYears() + ' anni') : 'Non calcolabile'}">
                              3 anni
                        </span>
                    </div>

                    <div class="info-item">
                        <label>Data di Nascita</label>
                        <span th:text="${animale.dataNascita != null ? #temporals.format(animale.dataNascita, 'dd/MM/yyyy') : 'Non specificata'}">01/01/2023</span>
                    </div>

                    <div class="info-item">
                        <label>Area di Alloggio</label>
                        <span th:text="${animale.area != null ? animale.area.nome : 'Non assegnata'}">Area Verde</span>
                    </div>
                </div>

                <div th:if="${userDetails != null and !userDetails.authorities.toString().contains('ADMIN')}" style="margin-top: 15px; text-align: left;">
                    <a th:href="@{/utenti/animali/{id}/nuova-richiesta(animaleId=${animale.id})}" class="btn-admin-edit" style="display: inline-flex; align-items: center; gap: 8px; padding: 14px 24px; background: linear-gradient(135deg, var(--verde-foresta) 0%, #226f54 100%);">
                        💝 Invia Richiesta di Adozione
                    </a>
                </div>
            </div>
        </div>
        
        <div class="medical-folder">
            <div class="medical-sheet">
                <div class="medical-title">⚕️ Cartella Clinica Ospite</div>
                
                <div class="medical-content">
                    <div class="medical-line">
                        <strong>DATA VISITA:</strong> 
                        <span th:text="${animale.cartellaClinica != null and animale.cartellaClinica.dataVisita != null ? #temporals.format(animale.cartellaClinica.dataVisita, 'dd/MM/yyyy') : 'Nessuna visita registrata'}">01/01/2026</span>
                    </div>
                    
                    <div class="medical-line">
                        <strong>PESO RISCONTRATO:</strong> 
                        <span th:text="${animale.cartellaClinica != null and animale.cartellaClinica.peso != null ? animale.cartellaClinica.peso + ' Kg' : 'Non inserito'}">-- Kg</span>
                    </div>
                    
                    <div class="medical-line">
                        <strong>DIAGNOSI:</strong> 
                        <p th:text="${animale.cartellaClinica != null ? animale.cartellaClinica.diagnosi : 'Nessuna diagnosi presente.'}" style="line-height: 30px; margin: 0;">Dettagli diagnosi...</p>
                    </div>
                    
                    <div class="medical-line">
                        <strong>TERAPIA ASSEGNATA:</strong> 
                        <p th:text="${animale.cartellaClinica != null and animale.cartellaClinica.terapia != null ? animale.cartellaClinica.terapia : 'Nessuna terapia in corso.'}" style="line-height: 30px; margin: 0;">Dettagli terapia...</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
