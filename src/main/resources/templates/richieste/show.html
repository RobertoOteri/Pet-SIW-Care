<!DOCTYPE html>
<html>

<head>
	<title th:text="'Richiesta Adozione #' + ${richiesta.id}">Dettagli Richiesta</title>
	<link rel="stylesheet" href="../css/style.css">
</head>

<body class="body-richiesta-show">
	<nav class="navbar-top">
		<button type="button" onclick="window.location.href='/'" class="btn-home-nav">
			🏡 Home
		</button>
		<div class="navbar-right">
			<div class="profile-avatar-wrapper">
				<img th:src="@{/immagini/profile_default.jpg}" alt="Profilo">
			</div>

			<form th:if="${userDetails != null}" th:action="@{/logout}" method="POST">
				<button type="submit" class="btn-action-nav btn-logout">Disconnetti</button>
			</form>

			<form th:if="${userDetails == null}" th:action="@{/login}">
				<button type="submit" class="btn-action-nav">🔑 Log in</button>
			</form>
		</div>
	</nav>

	<main class="profile-dashboard">

		<div class="dashboard-intro">
			<h1 class="animal-name-title" th:text="'Pratica di Adozione #' + ${richiesta.id}">Id richiesta</h1>

			<div th:class="'status-banner ' + 
		                  (${richiesta.stato.name() == 'IN_ATTESA'} ? 'status-waiting' : 
		                  (${richiesta.stato.name() == 'APPROVATA'} ? 'status-approved' : 'status-rejected'))">
				<span
					th:text="${richiesta.stato.name() == 'IN_ATTESA' ? '⏳ ' : (richiesta.stato.name() == 'APPROVATA' ? '✅ ' : '❌ ')}"></span>
				<span th:text="${richiesta.stato}">STATO</span>
			</div>
		</div>

		<section class="profile-info-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 25px;">
			<div class="info-item">
				<label>Animale Richiesto</label>
				<span>
					🐾 <a th:href="@{/animali/{id}(id=${richiesta.animale.id})}"
						th:text="${richiesta.animale.nome} + ' (' + ${richiesta.animale.specie} + ')'"
						class="table-link">Nome - Specie</a>
				</span>
			</div>

			<div class="info-item">
				<label>Data di Presentazione</label>
				<span th:text="${#temporals.format(richiesta.dataOra, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</span>
			</div>

			<div th:if="${richiesta.stato.name() == 'RIFIUTATA' and richiesta.dataOraRifiuto != null}"
				class="info-item">
				<label>Data di Rifiuto Pratica</label>
				<span th:text="${#temporals.format(richiesta.dataOraRifiuto, 'dd/MM/yyyy HH:mm')}"
					style="color: #d93838; font-weight: 700;">02/01/2026 15:00</span>
			</div>

			<div th:if="${richiesta.stato.name() == 'APPROVATA' and richiesta.dataOraAccettazione != null}"
				class="info-item">
				<label>Data di Approvazione</label>
				<span th:text="${#temporals.format(richiesta.dataOraAccettazione, 'dd/MM/yyyy HH:mm')}"
					style="color: var(--verde-foresta); font-weight: 700;">02/01/2026 15:00</span>
			</div>
		</section>

		<section class="info-item">
			<label>Lettera di Motivazione / Descrizione contesto familiare</label>
			<p th:text="${richiesta.descrizione}" class="area-description-text">
				Dettagli inseriti dall'utente...
			</p>
		</section>

		<div class="admin-area-actions">

			<th:block th:if="${userDetails != null and userDetails.authorities.toString().contains('DEFAULT')}">

				<a th:href="@{/utenti/richieste/{id}/modifica(id=${richiesta.id})}" class="btn-admin-edit">
					✏️ Modifica Informazioni
				</a>

				<form th:action="@{/utenti/richieste/{id}/elimina(id=${richiesta.id})}">
					<button type="submit"
						onclick="return confirm('Sei sicuro di voler annullare ed eliminare definitivamente questa richiesta?');"
						class="btn-table-action btn-danger"
						style="padding: 12px 22px; border-radius: 14px; font-size: 14px;">
						❌ Annulla Richiesta
					</button>
				</form>

			</th:block>


		</div>

	</main>
	<footer class="footer-classico-compatto">
		<div class="footer-container">
			<div class="footer-section">
				<a href="https://facebook.com" target="_blank" class="footer-link">
					<i class="fa-brands fa-facebook"></i> Facebook
				</a>
				<span class="bullet">•</span>
				<a href="https://instagram.com" target="_blank" class="footer-link">
					<i class="fa-brands fa-instagram"></i> Instagram
				</a>
			</div>

			<div class="footer-section footer-credits">
				Associazione Rifugio Pet-SIW-Care &copy; 2026
			</div>

			<div class="footer-section footer-contact-info">
				<span><i class="fa-regular fa-envelope"></i> rifugioPet-SIW-Care@gmail.com</span>
				<span class="bullet">•</span>
				<span><i class="fa-solid fa-phone"></i> +39 06 1234567</span>
			</div>
		</div>
	</footer>

</body>

</html>
