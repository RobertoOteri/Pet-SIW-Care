<!DOCTYPE html>
<html>
	<head>
		<title>Aggiungi Volontario</title>
		<link rel="stylesheet" th:href="@{/css/style.css}">
	</head>
	<body>
		<nav class="navbar-top">
		    <button type="button" onclick="window.location.href='/'" class="btn-home-nav">
		        🏡 Home
		    </button>
		    
		    <div class="navbar-right">
		        <div class="profile-avatar-wrapper">
		            <img th:src="@{https://static8.depositphotos.com/1009634/988/v/950/depositphotos_9883921-stock-illustration-no-user-profile-picture.jpg}" alt="Profilo">
		        </div>
		        
		        <form th:if="${userDetails != null}" th:action="@{/logout}" method="POST">
		            <button type="submit" class="btn-action-nav btn-logout">Disconnetti</button>
		        </form>
		        
		        <form th:if="${userDetails == null}" th:action="@{/login}">
		            <button type="submit" class="btn-action-nav">🔑 Log in</button>
		        </form>
		    </div>
		</nav>

		<div class="main-dashboard">
			
			<div class="dashboard-intro">
				<h1 th:text="${volontario.id == null} ? 'Registra Volontario 🤝' : 'Modifica Volontario ✏️'">Aggiungi Volontario</h1>
				<p>Inserisci i dati della persona che dedica il suo tempo al rifugio</p>
			</div>

			<form th:action="${volontario.id == null} ? @{/admin/volontari} : @{/admin/volontari/{id}/modifica(id=${volontario.id})}"  
				  th:method="POST" 
				  th:object="${volontario}"
				  class="form-strutturato">
				
				<div th:if="${#fields.hasGlobalErrors()}" class="form-error-global">
					<p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
				</div>

				<div class="form-group">
					<label>Codice Fiscale:</label>
					<input type="text" th:field="*{codiceFiscale}" placeholder="Es: RSSMRA80A01H501W"/>
					<span class="error-message" th:if="${#fields.hasErrors('codiceFiscale')}" th:errors="*{codiceFiscale}"></span>
				</div>

				<div class="form-group">
					<label>Nome:</label>
					<input type="text" th:field="*{nome}" placeholder="Es: Mario"/>
					<span class="error-message" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
				</div>

				<div class="form-group">
					<label>Cognome:</label>
					<input type="text" th:field="*{cognome}" placeholder="Es: Rossi"/>
					<span class="error-message" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"></span>
				</div>

				<div class="form-group">
					<label>Data Di Nascita:</label>
					<input type="date" th:field="*{dataDiNascita}"/>
					<span class="error-message" th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}"></span>
				</div>

				<div class="form-group">
					<label>Specializzazione:</label>
					<input type="text" th:field="*{specializzazione}" placeholder="Es: Cani aggressivi, Gatti anziani, Educatore..."/>
					<span class="error-message" th:if="${#fields.hasErrors('specializzazione')}" th:errors="*{specializzazione}"></span>
				</div>

				<div class="form-submit-container">
					<button type="submit" class="btn-action-nav btn-submit-form">
						Conferma Volontario
					</button>
				</div>

			</form>
		</div>
	</body>	
</html>
