<!DOCTYPE HTML>

<head>
	<title>ERRORE</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<nav class="navbar-top">

		<button type="button" onclick="window.location.href='/'" class="btn-home-nav">
			🏡 Home
		</button>

		<div class="navbar-right">

			<div class="profile-avatar-wrapper">
				<img th:src="@{/immagini/profile_default.jpg}" alt="Profilo">
			</div>

			<form th:if="${userDetails != null}" th:action="@{/logout}" method="POST">
				<button type="submit" class="btn-action-nav btn-logout">Disconnetti</button>
			</form>

			<form th:if="${userDetails == null}" th:action="@{/login}">
				<button type="submit" class="btn-action-nav">🔑 Log in</button>
			</form>

		</div>
	</nav>

	<div class="main-dashboard"
		style="max-width: 550px; margin-top: 100px; margin-bottom: 100px; margin-left: auto; margin-right: auto;">

		<div style="font-size: 72px; margin-bottom: 20px;">🚫</div>

		<div class="dashboard-intro">
			<h1 style="color: #d93838;">403 - Accesso Vietato</h1>
		</div>


		<div class="form-actions">
			<a th:href="@{/}" class="btn-action-nav"
				style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 12px 30px; font-size: 15px;">
				🏡 Torna alla Home
			</a>
		</div>

	</div>

	<footer class="footer-classico-compatto">
		<div class="footer-container">
			<div class="footer-section">
				<a href="https://facebook.com" target="_blank" class="footer-link">
					<i class="fa-brands fa-facebook"></i> Facebook
				</a>
				<span class="bullet">•</span>
				<a href="https://instagram.com" target="_blank" class="footer-link">
					<i class="fa-brands fa-instagram"></i> Instagram
				</a>
			</div>

			<div class="footer-section footer-credits">
				Associazione Rifugio Pet-SIW-Care &copy; 2026
			</div>

			<div class="footer-section footer-contact-info">
				<span><i class="fa-regular fa-envelope"></i> rifugioPet-SIW-Care@gmail.com</span>
				<span class="bullet">•</span>
				<span><i class="fa-solid fa-phone"></i> +39 06 1234567</span>
			</div>
		</div>
	</footer>
</body>

</html>
