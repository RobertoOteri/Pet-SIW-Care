<!DOCTYPE html>
<html>
	<head>
		<title>Volontari</title>
	</head>
	<body>
		<h1>Lista Volontari</h1>
		<ul>
			<li th:each="v : ${volontari}">

				<a th:href="@{'/volontari/' + ${v.id}}" th:text="${v.nome + ' ' + v.cognome}"></a>
			</li>
		</ul>
		<button th:if="${userDetails != null and userDetails.authorities.toString().contains('ADMIN')}" type ="submit">
			<a href="/admin/volontari/new"> Aggiungi volontari</a>
		</button>
	</body>	
</html>
