<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Il Rifugio</title>
	<link rel="stylesheet" href="../css/style.css">
</head>

<body>

	<nav class="navbar-top">
		<button type="button" onclick="window.location.href='/'" class="btn-home-nav">
			🏡 Home
		</button>
		
	</nav>

	<main class="main-dashboard">
		<div class="dashboard-intro">
			<h1>Accedi al Rifugio</h1>
			<p>Inserisci le tue credenziali per entrare nella tua area personale</p>
		</div>

		<div th:if="${param.error}" class="error-message">
			Username o password errati.
		</div>

		<form th:action="@{/login}" th:method="POST" class="auth-form">
			<div class="form-group">
				<label for="username">Username</label>
				<input type="text" id="username" name="username" placeholder="Inserisci il tuo username" required>
			</div>

			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" placeholder="Inserisci la tua password" required>
			</div>

			<div class="form-actions">
				<button type="submit" class="btn-action-nav btn-block">Conferma</button>
				<a th:href="@{/register}" class="auth-link">Non hai ancora un account? Registrati</a>
			</div>
		</form>
	</main>

</body>

</html>
