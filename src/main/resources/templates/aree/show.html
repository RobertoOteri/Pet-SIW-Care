<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${area.nome} + ' - Dettagli'">Dettagli Area</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-area-show"> <nav class="navbar-top">
            <button type="button" onclick="window.location.href='/'" class="btn-home-nav">
                🏡 Home
            </button>
			<div class="navbar-right">
			        
			        <div class="profile-avatar-wrapper">
			            <img th:src="@{https://static8.depositphotos.com/1009634/988/v/950/depositphotos_9883921-stock-illustration-no-user-profile-picture.jpg}" alt="Profilo">
			        </div>
			        
			        <form th:if="${userDetails != null}" th:action="@{/logout}" method="POST">
			            <button type="submit" class="btn-action-nav btn-logout">Disconnetti</button>
			        </form>
			        
			        <form th:if="${userDetails == null}" th:action="@{/login}">
			            <button type="submit" class="btn-action-nav">🔑 Log in</button>
			        </form>
			        
			    </div>
    </nav>

    <main class="profile-dashboard" style="max-width: 850px;">
        
        <div class="area-banner-box">
            <img th:src="${area?.immagineUrl != null ? area.immagineUrl : '/images/default-area.png'}" alt="Immagine Area">
        </div>

        <div class="dashboard-intro" style="text-align: left; margin-bottom: 25px;">
            <h1 th:text="${area.nome}" class="animal-name-title" style="margin-bottom: 15px;">Nome Area</h1>
            
            <div class="profile-info-grid" style="grid-template-columns: 1fr;">
                <div class="info-item">
                    <label>Capacità Massima Ospiti</label>
                    <span>
                         🐾 <strong th:text="${area.capacita}">10</strong> animali consentiti
                    </span>
                </div>
            </div>
        </div>

        <div class="info-item" style="text-align: left;">
            <label>Presentazione e Dettagli della Zona</label>
            <p th:text="${area.descrizione}" class="area-description-text">
                Descrizione dell'area...
            </p>
        </div>

        <div th:if="${userDetails != null and userDetails.authorities.toString().contains('ADMIN')}" class="admin-area-actions">
            
            <a th:href="@{/admin/aree/{id}/modifica(id=${area.id})}" class="btn-admin-edit">
                ✏️ Modifica Informazioni
            </a>
            
            <a th:href="@{/admin/aree/{id}/elimina(id=${area.id})}" 
               onclick="return confirm('Attenzione! Questa operazione eliminerà definitivamente l\'area e potrebbe influire sugli animali ospitati. Vuoi procedere?');" 
               class="btn-admin-delete">
                ❌ Elimina Area
            </a>
            
        </div>
        
    </main>

</body>
</html>
