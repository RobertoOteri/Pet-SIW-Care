<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Aree - Il Rifugio</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="body-aree"> <nav class="navbar-top">
			<button type="button" onclick="window.location.href='/'" class="btn-home-nav">
			            🏡 Home
			</button>
			<div class="navbar-right">
			            
			            <div class="profile-avatar-wrapper">
			                <img th:src="@{https://static8.depositphotos.com/1009634/988/v/950/depositphotos_9883921-stock-illustration-no-user-profile-picture.jpg}" alt="Profilo">
			            </div>
			            
			            <form th:if="${userDetails != null}" th:action="@{/logout}" method="POST">
			                <button type="submit" class="btn-action-nav btn-logout">Disconnetti</button>
			            </form>
			            
			            <form th:if="${userDetails == null}" th:action="@{/login}">
			                <button type="submit" class="btn-action-nav">🔑 Log in</button>
			            </form>
			            
			        </div>
    </nav>

    <main class="profile-dashboard" style="max-width: 950px;">
        <div class="dashboard-intro">
            <h1>Esplora le Aree del Rifugio</h1>
            <p>Seleziona una delle zone dedicate ai nostri ospiti per vedere i dettagli</p>
        </div>

        <div class="areas-grid">
            
            <a th:each="a : ${aree}" th:href="@{'/aree/' + ${a.id}}" class="area-card-link">
                <div class="area-image-wrapper">
                    <img src="../immagini/default-area.jpg" th:src="@{'/immagini/area_' + ${a.id} + '.jpg'}" alt="Immagine Area">
                </div>
                
                <div class="area-overlay">
                    <h3 class="area-name" th:text="${a.nome}">Nome Area</h3>
                </div>
            </a>

        </div>

        <div th:if="${#lists.isEmpty(aree)}" style="padding: 40px; color: var(--verde-foresta); font-weight: 600;">
            Non ci sono aree registrate nel sistema al momento.
        </div>

        <div th:if="${userDetails != null and userDetails.authorities.toString().contains('ADMIN')}" class="admin-actions-container">
            <button type="button" class="btn-admin-add">
                <a href="/admin/aree/form">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Aggiungi Nuova Area
                </a>
            </button>
        </div>
        
    </main>

</body>
</html>
